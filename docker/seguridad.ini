; ENRÍSATE · PHP sin anunciar su versión
; Por defecto PHP agrega "X-Powered-By: PHP/8.4.x" a cada respuesta: le dice a
; cualquiera qué versión exacta buscar en listas de vulnerabilidades.
; (OWASP A05 · CWE-200)
expose_php = Off

; Errores: al registro, nunca a la pantalla del visitante.
; La imagen php:apache no trae php.ini, y de fábrica PHP MUESTRA los errores en
; la página (rutas, consultas, datos) y NO los registra. Con esto el detalle va
; al registro de Apache (lo que se ve en los logs de Railway) y el visitante solo
; ve un aviso genérico (ver config.php). (OWASP A05 · CWE-209 / CWE-778)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Progreso de subida en la sesión: apagado.
; De fábrica PHP anota en la sesión el avance de cada subida de archivos, y lo
; hace ANTES de que corra cualquier código del panel, en cualquier petición
; POST, incluso sin haber iniciado sesión. Ese camino es el que usa una de las
; fallas de PHP2Shell (CVE-2026-109619, oct 2026). El panel no lo usa (las
; barras de avance se arman en el navegador), así que apagarlo no cambia nada
; para quien lo usa y quita una puerta de entrada. La corrección de fondo es
; la versión de PHP del Dockerfile; esto es una segunda capa.
session.upload_progress.enabled = Off
