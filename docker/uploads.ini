; ENRÍSATE · Límite real de subida de archivos
; ===============================================
; Sin este archivo, PHP corre con sus valores por defecto de fábrica:
; upload_max_filesize = 2M y post_max_size = 8M. El panel (ver
; includes/imagenes.php y el texto "máx. 8 MB" del modal de Productos)
; siempre asumió que se podía subir una foto de hasta 8 MB — pero
; ninguna foto de más de 2 MB llegaba nunca a ese código: PHP la
; rechazaba antes, en el propio parseo del formulario, con un mensaje
; que no explica la verdadera razón ("Elige una imagen para subir" o
; "La página estuvo abierta demasiado tiempo", según si la foto sola
; pasaba de 2 MB o si junto con el resto del formulario pasaba de 8 MB).
;
; Una foto de celular moderna normalmente pesa entre 2 y 6 MB, así que
; esto afectaba a casi cualquier foto recién tomada, sin ningún patrón
; visible del lado del producto o la marca — no es que fallara SOLO en
; "Crema de Peinar Rizos" (LP-06); esa fue, simplemente, la vez que
; alguien lo notó.
;
; 10M/12M deja margen sobre el límite de 8 MB que ya valida
; guardar_imagen_producto() (el resto del formulario — CSRF, sku,
; acción — pesa unos pocos bytes, pero el margen no cuesta nada).
upload_max_filesize = 10M
post_max_size = 12M
