# ENRÍSATE · Apache sin anunciar su versión ni su sistema
# De fábrica responde "Server: Apache/2.4.x (Debian)" y firma las páginas de
# error con la versión. (OWASP A05 · CWE-200)
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Registro de visitas con la IP REAL (la que informa el proxy de Railway en
# X-Real-IP) además de la del proxy. Sin esto el registro solo mostraba
# direcciones internas 100.64.x.x, una distinta en cada petición.
LogFormat "%{X-Real-IP}i via %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined

# Tamaño máximo de lo que se le puede enviar al panel en una sola petición.
# Apache trae de fábrica 1 GB. Las fallas de PHP2Shell (CVE-2026-109618 y
# CVE-2026-109619, oct 2026) se disparan con envíos de varios MB que PHP lee
# antes de que corra el código del panel; con este tope Apache los corta antes
# de que lleguen a PHP (responde 413). Ningún formulario del panel ni del
# catálogo manda más de unos pocos KB, así que 1 MB sobra. La única excepción
# es Productos (inventario.php), que recibe fotos de hasta 8 MB: ahí el tope es
# 13 MB, apenas sobre el post_max_size de 12 MB (ver docker/uploads.ini).
# Es una segunda capa: la corrección de fondo es la versión de PHP del Dockerfile.
LimitRequestBody 1048576
<LocationMatch "^/inventario\.php$">
    LimitRequestBody 13631488
</LocationMatch>
