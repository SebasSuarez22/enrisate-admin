# ENRÍSATE · Apache sin anunciar su versión ni su sistema
# De fábrica responde "Server: Apache/2.4.x (Debian)" y firma las páginas de
# error con la versión. (OWASP A05 · CWE-200)
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Registro de visitas con la IP REAL (la que informa el proxy de Railway en
# X-Real-IP) además de la del proxy. Sin esto el registro solo mostraba
# direcciones internas 100.64.x.x, una distinta en cada petición.
LogFormat "%{X-Real-IP}i via %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
